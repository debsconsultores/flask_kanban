services:
  db:
    image: postgres:18-alpine
    container_name: kanban_db
    environment:
      - POSTGRES_USER=flask_user
      - POSTGRES_PASSWORD=flask_password
      - POSTGRES_DB=kanban_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped

  redis:
    # Imagen oficial de Redis basada en Alpine.
    image: redis:7-alpine
    # Nombre identificable del contenedor.
    container_name: kanban_redis
    # Reinicia el contenedor si Docker lo detiene inesperadamente.
    restart: unless-stopped
    ports:
      - "6379:6379"

  adminer:
    image: adminer:latest
    restart: always
    ports:
      - "8080:8080"

volumes:
  postgres_data: