<!DOCTYPE html>
<html lang="rd">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Flask Kanban - {{ title }}</title>
</head>
<body class="bg-gray-100 font-sans">
    <nav class="bg-indigo-600 p-4 text-white shadow-lg">
        <div class="container mx-auto">
            <span class="text-xl font-bold">Kanban Pro</span>

            <div>
            {% if current_user.is_authenticated %}
                <a href="{{ url_for('auth.dashboard') }}" class="mr-4">Dashboard</a>
                <a href="{{ url_for('auth.profile') }}" class="mr-4">Perfil</a>
                <a href="{{ url_for('auth.logout') }}" class="bg-red-500 px-3 py-1 rounded">Salir</a>
            {% else %}
                <a href="{{ url_for('auth.login') }}" class="mr-4">Login</a>
                <a href="{{ url_for('auth.register') }}" class="bg-green-500 px-3 py-1 rounded">Registro</a>
            {% endif %}
            </div>

        </div>
    </nav>
    <main class="container mx-auto mt-8 p-4">
        {% block content %}Contenido por Defecto{% endblock %}
    </main>
</body>
</html>
