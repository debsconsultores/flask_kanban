{% extends "base.html" %}

{% block content %}
<div class="space-y-6">
    <!-- Encabezado del dashboard -->
    <div class="flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
        <div>
            <p class="text-sm font-medium text-indigo-600">
                Panel de trabajo
            </p>
            <h1 class="mt-1 text-3xl font-bold tracking-tight text-gray-900">
                Mi tablero Kanban
            </h1>
            <p class="mt-2 text-gray-600">
                Organiza y administra tus tareas desde un solo lugar.
            </p>

            <div class="mt-3">
                <span
                    id="api-status"
                    class="inline-flex items-center rounded-full
                        bg-gray-100 px-3 py-1 text-xs font-medium text-gray-600"
                >
                    Conectando con la API...
                </span>
                <p
                    id="api-info"
                    class="mt-2 text-xs text-gray-400"
                >
                </p>
            </div>
        </div>

        <!-- Botón crear tarea -->
        <button
            type="button"
            class="inline-flex items-center justify-center gap-2 rounded-lg
                   bg-indigo-600 px-5 py-3 text-sm font-semibold text-white
                   shadow-sm transition hover:bg-indigo-700
                   focus:outline-none focus:ring-2 focus:ring-indigo-500
                   focus:ring-offset-2"
        >
            <span class="text-lg">+</span>
            Nueva tarea
        </button>
    </div>

    <!-- Resumen -->
    <div class="grid grid-cols-1 gap-4 sm:grid-cols-3">

        <div class="rounded-xl border border-gray-200 bg-white p-4 shadow-sm">
            <p class="text-sm text-gray-500">
                Pendientes
            </p>
            <p class="mt-1 text-2xl font-bold text-gray-900">
                2
            </p>
        </div>

        <div class="rounded-xl border border-gray-200 bg-white p-4 shadow-sm">
            <p class="text-sm text-gray-500">
                En progreso
            </p>

            <p class="mt-1 text-2xl font-bold text-gray-900">
                1
            </p>
        </div>

        <div class="rounded-xl border border-gray-200 bg-white p-4 shadow-sm">
            <p class="text-sm text-gray-500">
                Completadas
            </p>

            <p class="mt-1 text-2xl font-bold text-gray-900">
                1
            </p>
        </div>

    </div>


    <!-- Tablero Kanban -->
    <div class="grid grid-cols-1 gap-6 lg:grid-cols-3">

        <!-- Pendientes -->
        <section class="rounded-xl bg-gray-100 p-4">

            <div class="mb-4 flex items-center justify-between">

                <div class="flex items-center gap-2">

                    <span class="h-3 w-3 rounded-full bg-gray-400"></span>

                    <h2 class="font-semibold text-gray-800">
                        Pendientes
                    </h2>

                </div>

                <span class="rounded-full bg-white px-3 py-1 text-xs font-semibold text-gray-600">
                    2
                </span>

            </div>


            <div class="space-y-4" id="tasks-pending"></div>

        </section>


        <!-- En progreso -->
        <section class="rounded-xl bg-blue-50 p-4">

            <div class="mb-4 flex items-center justify-between">

                <div class="flex items-center gap-2">

                    <span class="h-3 w-3 rounded-full bg-blue-500"></span>

                    <h2 class="font-semibold text-gray-800">
                        En progreso
                    </h2>

                </div>

                <span class="rounded-full bg-white px-3 py-1 text-xs font-semibold text-blue-600">
                    1
                </span>

            </div>


            <div class="space-y-4" id="tasks-in-progress"></div>
        </section>


        <!-- Completadas -->
        <section class="rounded-xl bg-green-50 p-4">

            <div class="mb-4 flex items-center justify-between">

                <div class="flex items-center gap-2">

                    <span class="h-3 w-3 rounded-full bg-green-500"></span>

                    <h2 class="font-semibold text-gray-800">
                        Completadas
                    </h2>
                </div>

                <span class="rounded-full bg-white px-3 py-1 text-xs font-semibold text-green-600">
                    1
                </span>
            </div>


            <div class="space-y-4" id="tasks-completed"></div>
        </section>
    </div>
</div>


<script>

    const apiStatus = document.getElementById("api-status");
    const apiInfo = document.getElementById("api-info");

    fetch("/api/v1/info", {method: "GET" })
        .then(response => response.json())
        .then(data => {
            // console.log(data);
            
            // apiStatus.textContent = "API Conectada";
            apiInfo.textContent = `${data.name} . versión ${data.version}`;
        })
        .catch(error => {
            console.error("Error:", error);
            apiStatus.textContent = "Error de conexión con la API";
            apiInfo.textContent = "No fue posible comunicarse con el servidor";
        });


    fetch("/api/v1/test", {method: "GET" })
        .then(response => response.json())
        .then(data => {
            
            apiStatus.textContent = data.mensaje;

        })
        .catch(error => {
            console.error("Error:", error);
            apiStatus.textContent = "Error de conexión con la API";
            apiInfo.textContent = "No fue posible comunicarse con el servidor";
        });


async function loginApi(email, password) {

    const response = await fetch("/api/v1/login", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            email: email,
            password: password
        })
    });

    const data = await response.json();

    if (!response.ok) {
        throw new Error(
            data.error || "No fue posible iniciar sesión"
        );
    }

    return data;
}

loginApi(
    "test@test.com",
    "123456"
)
    .then(data => {

        sessionStorage.setItem(
            "access_token",
            data.access_token
        );
        console.log("Login exitoso");
        console.log(data);

        return loadTasks();

    })
    .catch(error => {

        console.error(
            "Error de autenticación:",
            error.message
        );

});

const container = document.getElementById("tasks-pending");

async function loadTasks() {
    try{

        const token = sessionStorage.getItem(
            "access_token"
        );

        const response = await fetch(
            "/api/v1/tasks",
            {
                method: "GET",
                headers: {
                    "Authorization": `Bearer ${token}`
                }
            }
        );

        const tasks = await response.json();

        console.log(tasks);

        container.innerHTML = "";
        
        tasks.forEach(task => {
            console.log(task.title);
            const card = createTaskCard(task)
            container.appendChild(card)
        });
    } catch(error){
        console.error("Error Cargando Tareas", error)
    }
}   

function createTaskCard(task) {

    const article = document.createElement("article");

    article.className =
        "rounded-lg border border-gray-200 bg-white p-4 shadow-sm";

    article.innerHTML = `
        <div class="flex items-start justify-between gap-3">

            <h3 class="font-semibold text-gray-900">
                ${task.title}
            </h3>

            <button
                type="button"
                class="text-gray-400 hover:text-gray-600"
                aria-label="Opciones de tarea"
            >
                ⋮
            </button>

        </div>

        <p class="mt-2 text-sm leading-6 text-gray-600">
            ${task.content ?? ""}
        </p>

        <div class="mt-4">
            <span
                class="rounded-full bg-gray-100
                       px-2.5 py-1 text-xs font-medium text-gray-600"
            >
                Tarea
            </span>
        </div>
    `;

    return article;
}
</script>


{% endblock %}
